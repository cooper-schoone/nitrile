[package]
name = "nitrile"
version = "0.1.0"
authors = ["Cooper Schoone <schoone.co@gmail.com>"]
edition = "2024"
description = "CLI tool for managing LaTeX templates and projects"
license = "MIT"
repository = "https://github.com/cooper-schoone/nitrile"
readme = "README.md"
keywords = ["cli", "latex"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.4", features = ["cargo"] }
color-eyre = "0.6.5"
indicatif = "0.18.6"
lopdf = { version = "0.44.0", default-features = false }

[dev-dependencies]
pdf-extract = "0.12.0"
rstest = "0.26.1"
tempfile = "3.27.0"
test-with = { version = "0.17.0", default-features = false, features = ["executable"] }
