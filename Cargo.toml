[package]
name = "nitrile"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.4", features = ["cargo"] }
color-eyre = "0.6.5"
indicatif = "0.18.6"
lopdf = { version = "0.44.0", default-features = false }

[dev-dependencies]
pdf-extract = "0.12.0"
rstest = "0.26.1"
tempfile = "3.27.0"
test-with = { version = "0.17.0", default-features = false, features = ["executable"] }
